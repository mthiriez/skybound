<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1220">
<title>SKYBOUND — Lille</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0b1220;color:#eaf2ff;
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
 -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;background:#0b1220;touch-action:none}
#hud{position:fixed;top:0;left:0;right:0;display:flex;gap:10px;justify-content:center;
 padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 14px) 0 calc(env(safe-area-inset-left) + 14px);
 pointer-events:none;font-variant-numeric:tabular-nums}
.cell{background:rgba(8,14,26,.55);border:1px solid rgba(120,190,255,.22);border-radius:9px;
 padding:4px 10px;display:flex;align-items:baseline;gap:5px;backdrop-filter:blur(6px)}
.cell span{font-size:8px;letter-spacing:1.6px;color:#7fb4e6}
.cell b{font-size:16px;font-weight:800;color:#eaf2ff;min-width:34px;text-align:right}
.cell i{font-size:8px;font-style:normal;color:#7fb4e6}
.cell.fps b{font-size:12px;color:#9be7a0}
#stick{position:fixed;left:calc(env(safe-area-inset-left) + 14px);bottom:calc(env(safe-area-inset-bottom) + 14px);
 width:118px;height:118px;border-radius:50%;border:1.5px solid rgba(120,190,255,.25);
 background:radial-gradient(circle,rgba(20,40,70,.45),rgba(10,18,32,.25));pointer-events:none;opacity:.85}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;
 background:radial-gradient(circle at 40% 35%,#bfe4ff,#4a90d9 60%,#1d3f68);
 box-shadow:0 0 18px rgba(90,170,255,.55);transition:transform .04s linear}
#boost{position:fixed;right:calc(env(safe-area-inset-right) + 18px);bottom:calc(env(safe-area-inset-bottom) + 22px);
 width:86px;height:86px;border-radius:50%;border:2px solid rgba(255,196,90,.8);color:#fff;
 background:radial-gradient(circle at 50% 40%,rgba(255,180,60,.35),rgba(60,35,0,.55));
 font:800 12px/1 -apple-system,BlinkMacSystemFont,Arial,sans-serif;letter-spacing:2px;
 box-shadow:0 0 20px rgba(255,170,40,.35);z-index:4}
#boost.on{transform:scale(.94);box-shadow:0 0 30px rgba(255,190,60,.9)}
#pause{position:fixed;right:calc(env(safe-area-inset-right) + 16px);top:calc(env(safe-area-inset-top) + 8px);
 width:34px;height:34px;border-radius:9px;border:1px solid rgba(120,190,255,.3);
 background:rgba(8,14,26,.6);color:#cfe6ff;font-size:13px;z-index:6}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
 gap:10px;text-align:center;padding:24px 26px;z-index:20;
 background:radial-gradient(ellipse at 50% 42%,rgba(16,30,52,.92),rgba(5,9,16,.97))}
.overlay.hidden{display:none}
.brand{font-size:clamp(26px,7vw,44px);font-weight:900;letter-spacing:7px;
 background:linear-gradient(90deg,#bfe4ff,#7fb4ff,#ffd39b);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand.small{font-size:20px;letter-spacing:5px}
.place{font-size:10px;letter-spacing:4px;color:#8fc0ea}
p{font-size:12px;line-height:1.5;color:#9fb4cf;max-width:360px}
#bar{width:min(280px,70vw);height:4px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
#bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#5aa9ff,#ffd39b);transition:width .2s}
button#go,button#resume{margin-top:8px;padding:13px 34px;border-radius:30px;border:1.5px solid #6fb5ff;
 background:linear-gradient(180deg,rgba(90,169,255,.28),rgba(90,169,255,.06));color:#eaf6ff;
 font-size:13px;letter-spacing:3px;font-weight:800}
button#go:disabled{opacity:.35;border-color:rgba(160,190,220,.4)}
.credits{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 12px);left:0;right:0;
 font-size:8.5px;letter-spacing:.6px;color:#6d84a0;padding:0 20px;line-height:1.4}
#rotate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
 background:#0b1220;z-index:40;color:#cfe6ff;font-size:14px;letter-spacing:2px;text-align:center;padding:30px}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud">
  <div class="cell"><span>ALT</span><b id="alt">0</b><i>m</i></div>
  <div class="cell"><span>VIT</span><b id="spd">0</b><i>km/h</i></div>
  <div class="cell"><span>CAP</span><b id="hdg">0</b><i>°</i></div>
  <div class="cell fps"><span>FPS</span><b id="fps">0</b></div>
</div>
<div id="stick"><div id="knob"></div></div>
<button id="boost">BOOST</button>
<button id="pause">II</button>
<div id="start" class="overlay">
  <div class="brand">SKYBOUND</div>
  <div class="place">LILLE · HAUTS-DE-FRANCE</div>
  <p id="status">Préparation du terrain…</p>
  <div id="bar"><i></i></div>
  <button id="go" disabled>DÉCOLLER</button>
  <div class="credits">Photos aériennes BD ORTHO et relief RGE ALTI © IGN — Géoplateforme, Licence Ouverte Etalab 2.0. Bâtiments 3D non inclus dans cette version.</div>
</div>
<div id="pauseOverlay" class="overlay hidden">
  <div class="brand small">PAUSE</div>
  <button id="resume">REPRENDRE</button>
</div>
<div id="rotate">Tourne ton iPhone en paysage</div>
<div id="error" class="overlay hidden"><p id="errorMsg"></p></div>
<script type="module" src="./app.js?v=4"></script>
</body>
</html>
