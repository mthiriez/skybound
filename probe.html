<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SKYBOUND diagnostic 3</title>
<style>body{background:#fff;color:#000;font:12px/1.45 ui-monospace,monospace;padding:10px;white-space:pre-wrap}</style>
</head><body><div id="out">v3 diagnostic...</div>
<script>
const out = document.getElementById('out');
const log = s => { out.textContent += '\n' + s; };
const urlE = 'https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=ELEVATION.ELEVATIONGRIDCOVERAGE.HIGHRES&STYLE=normal&TILEMATRIXSET=WGS84G_6_14&TILEMATRIX=12&TILEROW=895&TILECOL=4165&FORMAT=image/x-bil;bits=32';
const urlAlt = 'https://data.geopf.fr/altimetrie/1.0/calcul/alti/rest/elevation.json?lon=3.0633|3.0900&lat=50.6366|50.6200&resource=ign_rge_alti_wld&zonly=true&indent=false';
(async () => {
  try {
    log('v3');
    // 1. altitude de reference par l'API altimetrie
    try {
      const ra = await fetch(urlAlt);
      const ja = await ra.json();
      log('API alti HTTP ' + ra.status + ' -> ' + JSON.stringify(ja.elevations || ja));
    } catch (e) { log('API alti KO: ' + e.message); }

    // 2. tuile BIL
    const r = await fetch(urlE);
    let b = await r.arrayBuffer();
    log('tuile octets: ' + b.byteLength);
    const u8 = new Uint8Array(b);
    let hex = '';
    for (let i = 0; i < 48; i++) hex += u8[i].toString(16).padStart(2,'0') + (i % 4 === 3 ? ' ' : '');
    log('48 premiers octets: ' + hex);
    const dv = new DataView(b);
    const be = [], le = [];
    for (let i = 0; i < 6; i++) { be.push(dv.getFloat32(i*4, false).toExponential(2)); le.push(dv.getFloat32(i*4, true).toExponential(2)); }
    log('floats BE: ' + be.join(' '));
    log('floats LE: ' + le.join(' '));
    let mn8 = 255, mx8 = 0; for (let i = 0; i < 64; i++) { if (u8[i] < mn8) mn8 = u8[i]; if (u8[i] > mx8) mx8 = u8[i]; }
    log('octets bruts 0..63: min ' + mn8 + ' max ' + mx8);

    // 3. valeurs au pixel de Lille dans les deux ordres
    const TILE_DEG = 180/4096;
    const lonW = -180 + 4165*TILE_DEG, latN = 90 - 895*TILE_DEG;
    const px = Math.round((3.0633-lonW)/TILE_DEG*256), py = Math.round((latN-50.6366)/TILE_DEG*256);
    const off = (py*256+px)*4;
    log('pixel Lille x=' + px + ' y=' + py);
    log('valeur BE=' + dv.getFloat32(off, false).toFixed(2) + ' | LE=' + dv.getFloat32(off, true).toFixed(2));
    log('octets a cet offset: ' + u8[off].toString(16) + ' ' + u8[off+1].toString(16) + ' ' + u8[off+2].toString(16) + ' ' + u8[off+3].toString(16));
    log('TERMINE');
  } catch (e) { log('ERREUR: ' + e.message); }
})();
</script></body></html>
