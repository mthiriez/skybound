<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SKYBOUND diagnostic</title>
<style>body{background:#fff;color:#000;font:13px/1.5 ui-monospace,monospace;padding:12px;white-space:pre-wrap}</style>
</head><body><div id="out">diagnostic...</div>
<script>
const out = document.getElementById('out');
const log = s => { out.textContent += '\n' + s; };
const urlE = 'https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=ELEVATION.ELEVATIONGRIDCOVERAGE.HIGHRES&STYLE=normal&TILEMATRIXSET=WGS84G_6_14&TILEMATRIX=12&TILEROW=895&TILECOL=4165&FORMAT=image/x-bil;bits=32';
const urlO = 'https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=ORTHOIMAGERY.ORTHOPHOTOS&STYLE=normal&TILEMATRIXSET=PM&TILEMATRIX=14&TILEROW=5510&TILECOL=8330&FORMAT=image/jpeg';
(async () => {
  try {
    const c = document.createElement('canvas');
    const gl = c.getContext('webgl2') || c.getContext('webgl');
    log('WebGL: ' + (gl ? 'oui' : 'NON'));
    if (gl) log('renderer: ' + gl.getParameter(gl.VERSION));
    log('DecompressionStream: ' + (typeof DecompressionStream));

    const r = await fetch(urlE);
    log('relief HTTP ' + r.status + ' | encoding=' + r.headers.get('content-encoding') + ' | length=' + r.headers.get('content-length'));
    let b = await r.arrayBuffer();
    log('relief octets: ' + b.byteLength);
    if (b.byteLength < 262144) {
      try {
        const ds = new DecompressionStream('deflate');
        const st = new Blob([b]).stream().pipeThrough(ds);
        b = await new Response(st).arrayBuffer();
        log('apres decompression: ' + b.byteLength);
      } catch (e) { log('decompression KO: ' + e.message); }
    }
    if (b.byteLength >= 262144) {
      const dv = new DataView(b);
      let mn = 1e9, mx = -1e9, s = 0, fin = 0;
      for (let i = 0; i < 262144; i++) { const v = dv.getFloat32(i*4, false); if (isFinite(v)) { fin++; if (v<mn) mn=v; if (v>mx) mx=v; s+=v; } }
      log('relief big-endian : min=' + mn.toFixed(1) + ' max=' + mx.toFixed(1) + ' moy=' + (s/fin).toFixed(1));
      let n2 = 1e9, x2 = -1e9;
      for (let i = 0; i < 262144; i++) { const v = dv.getFloat32(i*4, true); if (isFinite(v)) { if (v<n2) n2=v; if (v>x2) x2=v; } }
      log('relief little-endian : min=' + n2.toFixed(1) + ' max=' + x2.toFixed(1));
      log('premieres valeurs BE: ' + dv.getFloat32(0,false).toFixed(1) + ' ' + dv.getFloat32(4,false).toFixed(1) + ' ' + dv.getFloat32(1024,false).toFixed(1));
    }

    const img = new Image(); img.crossOrigin = 'anonymous';
    await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('image refusee')); img.src = urlO; });
    log('ortho: ' + img.naturalWidth + 'x' + img.naturalHeight);
    const cv = document.createElement('canvas'); cv.width = 8; cv.height = 8;
    const g2 = cv.getContext('2d'); g2.drawImage(img, 0, 0, 8, 8);
    const px = g2.getImageData(0, 0, 1, 1).data;
    log('pixel ortho (pas de corruption CORS): ' + px[0] + ',' + px[1] + ',' + px[2]);
    log('TERMINE');
  } catch (e) { log('ERREUR: ' + e.message); }
})();
</script></body></html>
