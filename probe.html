<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SKYBOUND diagnostic</title>
<style>body{background:#fff;color:#000;font:13px/1.5 ui-monospace,monospace;padding:12px;white-space:pre-wrap}</style>
</head><body><div id="out">diagnostic...</div>
<script>
const out = document.getElementById('out');
const log = s => { out.textContent += '\n' + s; };
const urlE = 'https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=ELEVATION.ELEVATIONGRIDCOVERAGE.HIGHRES&STYLE=normal&TILEMATRIXSET=WGS84G_6_14&TILEMATRIX=12&TILEROW=895&TILECOL=4165&FORMAT=image/x-bil;bits=32';
const urlO = 'https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=ORTHOIMAGERY.ORTHOPHOTOS&STYLE=normal&TILEMATRIXSET=PM&TILEMATRIX=14&TILEROW=5510&TILECOL=8330&FORMAT=image/jpeg';
(async () => {
  try {
    const c = document.createElement('canvas');
    const gl = c.getContext('webgl2') || c.getContext('webgl');
    log('WebGL: ' + (gl ? 'oui ' + gl.getParameter(gl.VERSION) : 'NON'));

    const r = await fetch(urlE);
    let b = await r.arrayBuffer();
    log('relief HTTP ' + r.status + ' | octets ' + b.byteLength);

    if (b.byteLength >= 262144) {
      const n = Math.floor(b.byteLength / 4);
      const dv = new DataView(b);
      let beMin = 1e30, beMax = -1e30, beSum = 0, beFin = 0;
      let leMin = 1e30, leMax = -1e30, leSum = 0, leFin = 0;
      for (let i = 0; i < n; i++) {
        const a = dv.getFloat32(i*4, false);
        if (isFinite(a)) { beFin++; if (a<beMin) beMin=a; if (a>beMax) beMax=a; beSum+=a; }
        const z = dv.getFloat32(i*4, true);
        if (isFinite(z)) { leFin++; if (z<leMin) leMin=z; if (z>leMax) leMax=z; leSum+=z; }
      }
      log('flottants: ' + n);
      log('BE min=' + beMin.toFixed(1) + ' max=' + beMax.toFixed(1) + ' moy=' + (beSum/beFin).toFixed(1) + ' finis=' + beFin);
      log('LE min=' + leMin.toFixed(1) + ' max=' + leMax.toFixed(1) + ' moy=' + (leSum/leFin).toFixed(1) + ' finis=' + leFin);
      let hex = '';
      const u8 = new Uint8Array(b, 0, 16);
      for (let i = 0; i < 16; i++) hex += u8[i].toString(16).padStart(2, '0');
      log('16 premiers octets: ' + hex);
      // altitude au centre de Lille si BE
      log('valeur a l index 50000 BE=' + dv.getFloat32(50000*4, false).toFixed(1) + ' LE=' + dv.getFloat32(50000*4, true).toFixed(1));
    } else {
      log('relief trop court');
    }

    const img = new Image(); img.crossOrigin = 'anonymous';
    await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('image refusee')); img.src = urlO; });
    const cv = document.createElement('canvas'); cv.width = 4; cv.height = 4;
    const g2 = cv.getContext('2d'); g2.drawImage(img, 0, 0, 4, 4);
    const px = g2.getImageData(0, 0, 1, 1).data;
    log('ortho ' + img.naturalWidth + 'x' + img.naturalHeight + ' pixel=' + px[0] + ',' + px[1] + ',' + px[2]);
    log('TERMINE');
  } catch (e) { log('ERREUR: ' + e.message); }
})();
</script></body></html>
